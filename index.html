<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PsicoApp</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f0f2f8;--bg2:#ffffff;--bg3:#f5f7fc;--border:#dde2f0;
    --accent:#4f6ef7;--accent2:#7c5cfc;--text:#1a1f36;--text2:#4a5578;--text3:#8f9bb8;
    --danger:#e8395a;--warning:#f59e0b;--success:#10b981;
    --urgent:#e8395a;--soon:#f59e0b;--ok:#10b981;
    --radius:12px;--shadow:0 2px 12px rgba(79,110,247,0.08);
    --shadow2:0 4px 24px rgba(79,110,247,0.13);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

  /* ===== LOGIN ===== */
  #login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#eef1fb 0%,#f0eaff 100%);display:flex;align-items:center;justify-content:center;z-index:9999;transition:opacity .3s;}
  #login-screen.hidden{display:none;}
  .login-card{background:#fff;border-radius:20px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 8px 40px rgba(79,110,247,0.15);border:1.5px solid var(--border);}
  .login-logo{text-align:center;font-size:28px;font-weight:700;color:var(--accent);letter-spacing:-.5px;margin-bottom:4px;}
  .login-logo span{color:var(--accent2);}
  .login-sub{text-align:center;font-size:13px;color:var(--text3);margin-bottom:32px;}
  .login-group{margin-bottom:18px;}
  .login-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;display:block;}
  .login-input-wrap{position:relative;}
  .login-input{width:100%;background:var(--bg3);border:1.5px solid var(--border);border-radius:10px;color:var(--text);font-size:14px;padding:11px 44px 11px 14px;outline:none;font-family:'Plus Jakarta Sans',sans-serif;transition:border-color .2s;}
  .login-input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(79,110,247,.1);}
  .login-eye{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);font-size:16px;padding:2px;}
  .caps-warn{display:none;align-items:center;gap:6px;margin-top:7px;font-size:11px;font-weight:600;color:#92400e;background:#fef3c7;border:1px solid #fcd34d;border-radius:7px;padding:6px 10px;}
  .caps-warn.show{display:flex;}
  .login-error{display:none;font-size:12px;font-weight:600;color:var(--danger);background:rgba(232,57,90,.06);border:1px solid rgba(232,57,90,.2);border-radius:8px;padding:9px 13px;margin-bottom:16px;text-align:center;}
  .login-error.show{display:block;}
  .login-btn{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:background .2s;margin-top:4px;}
  .login-btn:hover{background:#3d5be8;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  .login-shake{animation:shake .4s ease;}

  /* ===== APP ===== */
  #app{display:none;}
  #app.show{display:block;}

  .header{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 24px;display:flex;align-items:center;gap:16px;height:60px;position:sticky;top:0;z-index:100;box-shadow:var(--shadow);}
  .header-logo{font-size:20px;font-weight:700;color:var(--accent);letter-spacing:-.5px;white-space:nowrap;}
  .header-logo span{color:var(--accent2);}
  .header-actions{display:flex;align-items:center;gap:8px;margin-left:auto;}
  .header-sync{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:6px;}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--success);}
  .sync-dot.offline{background:var(--danger);}
  .sync-dot.syncing{background:var(--warning);animation:pulse 1s infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  .banner{display:none;background:linear-gradient(135deg,#fff7ed,#fef3c7);border-bottom:2px solid #fcd34d;padding:14px 24px;}
  .banner.show{display:block;}
  .banner-title{font-size:13px;font-weight:700;color:#92400e;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .banner-items{display:flex;flex-direction:column;gap:6px;}
  .banner-item{font-size:12px;color:#78350f;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.7);padding:8px 12px;border-radius:8px;border-left:3px solid var(--urgent);}
  .banner-item.breve{border-left-color:var(--soon);}
  .banner-item.dias{border-left-color:#3b82f6;color:#1e3a8a;}
  .banner-close{margin-left:auto;background:none;border:none;color:#92400e;cursor:pointer;font-size:16px;}

  .layout{display:flex;height:calc(100vh - 60px);}

  .sidebar{width:248px;min-width:248px;background:var(--bg2);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column;padding-bottom:16px;}
  .sidebar-section{padding:20px 16px 6px;font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1.2px;}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;margin:2px 8px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);transition:all .15s;border:none;background:none;width:calc(100% - 16px);text-align:left;}
  .nav-item:hover{background:var(--bg3);color:var(--text);}
  .nav-item.active{background:linear-gradient(135deg,rgba(79,110,247,.1),rgba(124,92,252,.08));color:var(--accent);border:1px solid rgba(79,110,247,.15);}
  .nav-item .badge{margin-left:auto;font-size:10px;background:var(--urgent);color:#fff;border-radius:10px;padding:2px 7px;font-weight:700;}
  .nav-item .badge.soon{background:var(--soon);}
  .nav-item .badge.dias{background:#3b82f6;}
  .nav-code{font-family:'JetBrains Mono',monospace;font-size:10px;background:rgba(79,110,247,.1);color:var(--accent);padding:2px 6px;border-radius:5px;flex-shrink:0;}
  .nav-lock{display:flex;align-items:center;gap:10px;padding:10px 14px;margin:8px 8px 2px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;color:var(--danger);border:1px solid rgba(232,57,90,.2);background:rgba(232,57,90,.04);width:calc(100% - 16px);text-align:left;transition:all .15s;}
  .nav-lock:hover{background:rgba(232,57,90,.1);}

  .main{flex:1;overflow-y:auto;padding:28px;}
  .materia-header{margin-bottom:24px;}
  .materia-code{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);background:rgba(79,110,247,.08);padding:3px 10px;border-radius:6px;display:inline-block;margin-bottom:8px;font-weight:600;}
  .materia-title{font-size:24px;font-weight:700;color:var(--text);letter-spacing:-.5px;}

  .tabs{display:flex;gap:4px;margin-bottom:20px;background:var(--bg3);padding:4px;border-radius:12px;border:1px solid var(--border);}
  .tab{flex:1;padding:8px 14px;border-radius:9px;border:none;background:none;color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:'Plus Jakarta Sans',sans-serif;}
  .tab.active{background:var(--bg2);color:var(--accent);box-shadow:0 1px 6px rgba(79,110,247,.12);}

  .btn{padding:8px 16px;border-radius:9px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:6px;font-family:'Plus Jakarta Sans',sans-serif;}
  .btn:hover{background:var(--bg3);border-color:var(--accent);color:var(--accent);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:#3d5be8;}
  .btn.danger{background:rgba(232,57,90,.06);border-color:var(--danger);color:var(--danger);}
  .btn.small{padding:4px 10px;font-size:11px;}

  .anotacao-toolbar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .anotacao-area{width:100%;min-height:300px;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:14px;line-height:1.8;padding:18px;resize:vertical;font-family:'Plus Jakarta Sans',sans-serif;outline:none;transition:border-color .2s;box-shadow:var(--shadow);}
  .anotacao-area:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,110,247,.1);}
  .anotacao-meta{font-size:11px;color:var(--text3);margin-top:8px;font-family:'JetBrains Mono',monospace;}

  .nova-tarefa-form{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:20px;box-shadow:var(--shadow);}
  .form-row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .form-group{display:flex;flex-direction:column;gap:5px;flex:1;min-width:140px;}
  .form-label{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
  .form-input{background:var(--bg3);border:1.5px solid var(--border);border-radius:9px;color:var(--text);font-size:13px;padding:9px 13px;outline:none;font-family:'Plus Jakarta Sans',sans-serif;transition:border-color .2s;}
  .form-input:focus{border-color:var(--accent);background:var(--bg2);}
  .form-input::placeholder{color:var(--text3);}
  textarea.form-input{min-height:60px;resize:vertical;}

  .tarefa-list{display:flex;flex-direction:column;gap:10px;}
  .tarefa-card{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;gap:14px;align-items:flex-start;transition:all .2s;box-shadow:var(--shadow);}
  .tarefa-card:hover{border-color:var(--accent);box-shadow:var(--shadow2);}
  .tarefa-check{width:20px;height:20px;border-radius:50%;border:2px solid var(--border);cursor:pointer;flex-shrink:0;margin-top:2px;transition:all .15s;display:flex;align-items:center;justify-content:center;font-size:11px;background:var(--bg3);}
  .tarefa-check:hover{border-color:var(--accent);background:rgba(79,110,247,.08);}
  .tarefa-body{flex:1;}
  .tarefa-titulo{font-size:14px;font-weight:600;color:var(--text);margin-bottom:4px;}
  .tarefa-desc{font-size:12px;color:var(--text2);margin-bottom:8px;line-height:1.6;}
  .tarefa-footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .urgencia-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;}
  .urgencia-badge.urgente{background:rgba(232,57,90,.1);color:var(--urgent);border:1px solid rgba(232,57,90,.25);}
  .urgencia-badge.breve{background:rgba(245,158,11,.1);color:#d97706;border:1px solid rgba(245,158,11,.25);}
  .urgencia-badge.dias{background:rgba(59,130,246,.1);color:#1d4ed8;border:1px solid rgba(59,130,246,.25);}
  .urgencia-badge.ok{background:rgba(16,185,129,.08);color:#059669;border:1px solid rgba(16,185,129,.2);}
  .tarefa-data{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;}
  .tarefa-actions{display:flex;gap:6px;margin-left:auto;}
  .alerta-dias{display:flex;align-items:center;gap:8px;background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.2);border-radius:8px;padding:7px 12px;font-size:11px;color:#1d4ed8;font-weight:600;margin-bottom:6px;}
  .alerta-breve{background:rgba(245,158,11,.08);border-color:rgba(245,158,11,.3);color:#92400e;}

  .upload-area{border:2px dashed var(--border);border-radius:var(--radius);padding:36px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:20px;background:var(--bg2);}
  .upload-area:hover,.upload-area.drag{border-color:var(--accent);background:rgba(79,110,247,.04);}
  .upload-icon{font-size:36px;margin-bottom:10px;}
  .upload-text{font-size:14px;color:var(--text2);font-weight:500;}
  .upload-sub{font-size:12px;color:var(--text3);margin-top:4px;}
  .upload-input{display:none;}

  .anexo-list{display:flex;flex-direction:column;gap:8px;}
  .anexo-card{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);padding:13px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);}
  .anexo-icon{font-size:24px;width:36px;text-align:center;}
  .anexo-info{flex:1;}
  .anexo-nome{font-size:13px;font-weight:600;color:var(--text);margin-bottom:2px;}
  .anexo-meta{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;}
  .anexo-actions{display:flex;gap:6px;}

  .dash-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-bottom:24px;}
  .dash-card{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .dash-card-val{font-size:32px;font-weight:700;color:var(--accent);font-family:'JetBrains Mono',monospace;}
  .dash-card-label{font-size:11px;color:var(--text2);margin-top:4px;font-weight:500;}
  .dash-tarefas{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
  .dash-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:14px;}
  .dash-tarefa-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px;}
  .dash-tarefa-row:last-child{border-bottom:none;}
  .dash-materia-pill{font-size:10px;background:rgba(79,110,247,.08);color:var(--accent);padding:2px 8px;border-radius:10px;font-family:'JetBrains Mono',monospace;white-space:nowrap;font-weight:600;}

  .empty{text-align:center;padding:52px 20px;color:var(--text3);}
  .empty-icon{font-size:44px;margin-bottom:12px;}
  .empty-text{font-size:14px;font-weight:500;}

  .toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);padding:13px 18px;font-size:13px;font-weight:500;color:var(--text);box-shadow:var(--shadow2);z-index:9999;transform:translateY(80px);opacity:0;transition:all .3s;max-width:300px;}
  .toast.show{transform:translateY(0);opacity:1;}
  .toast.success{border-color:var(--success);background:#f0fdf4;}
  .toast.error{border-color:var(--danger);background:#fff1f2;}

  .mob-toggle{display:none;background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:4px;}
  .overlay{display:none;position:fixed;inset:0;background:rgba(26,31,54,.4);z-index:99;}

  @media(max-width:768px){
    .mob-toggle{display:block;}
    .sidebar{position:fixed;left:-248px;top:60px;height:calc(100vh - 60px);z-index:100;transition:left .25s;}
    .sidebar.open{left:0;}
    .overlay.show{display:block;}
    .main{padding:16px;}
    .dash-grid{grid-template-columns:repeat(2,1fr);}
    .form-row{flex-direction:column;}
    .tabs{overflow-x:auto;}
    .tab{white-space:nowrap;}
    .header-sync{display:none;}
    .login-card{margin:16px;padding:32px 24px;}
  }

  .section-hidden{display:none;}
  @keyframes fadeOut{0%{opacity:1;max-height:200px}100%{opacity:0;max-height:0;margin:0;padding:0;border:none;}}
  .tarefa-saindo{animation:fadeOut .4s ease forwards;overflow:hidden;pointer-events:none;}
  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
</style>
</head>
<body>

<!-- ===== TELA DE LOGIN ===== -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">Psico<span>App</span></div>
    <div class="login-sub">Acesso restrito — informe sua senha</div>

    <div class="login-error" id="login-error">Senha incorreta. Tente novamente.</div>

    <div class="login-group">
      <label class="login-label">Senha</label>
      <div class="login-input-wrap">
        <input class="login-input" type="password" id="login-senha" placeholder="••••••••••••" autocomplete="current-password">
        <button class="login-eye" id="login-eye" tabindex="-1">👁️</button>
      </div>
      <div class="caps-warn" id="caps-warn">⚠️ Caps Lock está LIGADO</div>
    </div>

    <button class="login-btn" id="login-btn">Entrar</button>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app">
  <div class="toast" id="toast"></div>
  <div class="overlay" id="overlay"></div>

  <div class="banner" id="banner">
    <div class="banner-title">
      🔔 Atenção — tarefas próximas do prazo
      <button class="banner-close" id="bannerClose">✕</button>
    </div>
    <div class="banner-items" id="bannerItems"></div>
  </div>

  <div class="header">
    <button class="mob-toggle" id="mobToggle">☰</button>
    <div class="header-logo">Psico<span>App</span></div>
    <div class="header-actions">
      <button id="btnExportar" class="btn" style="font-size:11px;padding:5px 12px;">⬇️ Backup</button>
      <label class="btn" style="font-size:11px;padding:5px 12px;cursor:pointer;">⬆️ Restaurar<input type="file" id="importFile" accept=".json" style="display:none"></label>
      <div class="header-sync">
        <div class="sync-dot" id="syncDot"></div>
        <span id="syncLabel">conectando…</span>
      </div>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar" id="sidebar">
      <div class="sidebar-section">Visão Geral</div>
      <button class="nav-item active" data-section="dashboard">📊 Dashboard</button>

      <div class="sidebar-section">Matérias</div>
      <button class="nav-item" data-section="AVP_IV"><span class="nav-code">AVP IV</span> Aval. Psicológica IV<span class="badge" id="badge-AVP_IV" style="display:none"></span></button>
      <button class="nav-item" data-section="ECSB_IV"><span class="nav-code">ECSB IV</span> Estágio Básico IV<span class="badge" id="badge-ECSB_IV" style="display:none"></span></button>
      <button class="nav-item" data-section="NPSI"><span class="nav-code">NPSI</span> Neuropsicologia<span class="badge" id="badge-NPSI" style="display:none"></span></button>
      <button class="nav-item" data-section="ORP_II"><span class="nav-code">ORP II</span> Orientação Prof. II<span class="badge" id="badge-ORP_II" style="display:none"></span></button>
      <button class="nav-item" data-section="PSIAP_II"><span class="nav-code">PSIAP II</span> Aprendizagem II<span class="badge" id="badge-PSIAP_II" style="display:none"></span></button>
      <button class="nav-item" data-section="PSC_I"><span class="nav-code">PSC I</span> Social e Comunit. I<span class="badge" id="badge-PSC_I" style="display:none"></span></button>
      <button class="nav-item" data-section="PSPA_II"><span class="nav-code">PSPA II</span> Psicopatologia II<span class="badge" id="badge-PSPA_II" style="display:none"></span></button>
      <button class="nav-item" data-section="EAPP"><span class="nav-code">EAPP</span> Ética e Atuação<span class="badge" id="badge-EAPP" style="display:none"></span></button>

      <div style="flex:1"></div>
      <div style="padding:0 8px 8px;">
        <button class="nav-lock" id="btnBloquear">🔒 Bloquear app</button>
      </div>
    </div>

    <div class="main" id="main">
      <div id="section-dashboard">
        <div class="materia-header">
          <div class="materia-title">📊 Dashboard</div>
        </div>
        <div class="dash-grid" id="dashStats"></div>
        <div class="dash-tarefas">
          <div class="dash-title">⚠️ Próximas tarefas</div>
          <div id="dashProximas"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue, remove, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getStorage, ref as sref, uploadBytes, getDownloadURL, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

  authDomain: "lembrete-f9484.firebaseapp.com",
  databaseURL: "https://lembrete-f9484-default-rtdb.firebaseio.com",
  projectId: "lembrete-f9484",
  storageBucket: "lembrete-f9484.firebasestorage.app",
  messagingSenderId: "256819423168",
  appId: "1:256819423168:web:4028f4c40f83544bd78a25"
};

const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
const storage = getStorage(fbApp);

// ---- LOGIN ----
const loginScreen = document.getElementById('login-screen');
const appDiv = document.getElementById('app');
const loginSenha = document.getElementById('login-senha');
const loginError = document.getElementById('login-error');
const capsWarn = document.getElementById('caps-warn');
const loginEye = document.getElementById('login-eye');

function mostrarApp() {
  loginScreen.classList.add('hidden');
  appDiv.classList.add('show');
  sessionStorage.setItem('psico_auth', '1');
}

function bloquear() {
  loginScreen.classList.remove('hidden');
  appDiv.classList.remove('show');
  sessionStorage.removeItem('psico_auth');
  loginSenha.value = '';
  loginError.classList.remove('show');
  setTimeout(() => loginSenha.focus(), 100);
}

function tentarLogin() {
  const val = loginSenha.value;
  if (val === SENHA_CORRETA) {
    loginError.classList.remove('show');
    mostrarApp();
  } else {
    loginError.classList.add('show');
    loginSenha.value = '';
    loginSenha.classList.add('login-shake');
    setTimeout(() => loginSenha.classList.remove('login-shake'), 400);
    loginSenha.focus();
  }
}

// Caps Lock
loginSenha.addEventListener('keyup', e => {
  const caps = e.getModifierState && e.getModifierState('CapsLock');
  capsWarn.classList.toggle('show', caps);
});
loginSenha.addEventListener('keydown', e => {
  const caps = e.getModifierState && e.getModifierState('CapsLock');
  capsWarn.classList.toggle('show', caps);
  if (e.key === 'Enter') tentarLogin();
});

// Mostrar/ocultar senha
loginEye.addEventListener('click', () => {
  const isPass = loginSenha.type === 'password';
  loginSenha.type = isPass ? 'text' : 'password';
  loginEye.textContent = isPass ? '🙈' : '👁️';
});

document.getElementById('login-btn').addEventListener('click', tentarLogin);
document.getElementById('btnBloquear').addEventListener('click', bloquear);

// Manter sessão na aba
if (sessionStorage.getItem('psico_auth') === '1') {
  mostrarApp();
} else {
  setTimeout(() => loginSenha.focus(), 200);
}

const MATERIAS = [
  { id:'AVP_IV',   code:'AVP IV',   nome:'Avaliação Psicológica IV' },
  { id:'ECSB_IV',  code:'ECSB IV',  nome:'Estágio Curricular Supervisionado Nível Básico IV' },
  { id:'NPSI',     code:'NPSI',     nome:'Neuropsicologia' },
  { id:'ORP_II',   code:'ORP II',   nome:'Orientação Profissional II' },
  { id:'PSIAP_II', code:'PSIAP II', nome:'Psicologia da Aprendizagem II' },
  { id:'PSC_I',    code:'PSC I',    nome:'Psicologia Social e Comunitária I' },
  { id:'PSPA_II',  code:'PSPA II',  nome:'Psicopatologia II' },
  { id:'EAPP',     code:'EAPP',     nome:'Ética e Atuação Profissional em Psicologia' },
];

let allData = {};
const anotacaoTimers = {};

function setSyncStatus(s) {
  const dot = document.getElementById('syncDot');
  const lbl = document.getElementById('syncLabel');
  dot.className = 'sync-dot' + (s==='ok' ? '' : ' '+s);
  lbl.textContent = s==='ok' ? 'conectado' : s==='syncing' ? 'salvando…' : 'offline';
}

function toast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

function calcUrgencia(dataStr) {
  if (!dataStr) return null;
  const diff = new Date(dataStr) - new Date();
  const dias = diff / 86400000;
  if (dias < 0)   return { label:'Vencida',     cls:'urgente', diasNum: Math.abs(Math.ceil(dias)) };
  if (dias <= 2)  return { label:'Urgente',     cls:'urgente', diasNum: Math.ceil(dias) };
  if (dias <= 7)  return { label:'Esta semana', cls:'breve',   diasNum: Math.ceil(dias) };
  if (dias <= 14) return { label:`${Math.ceil(dias)} dias`, cls:'dias', diasNum: Math.ceil(dias) };
  return { label:'No prazo', cls:'ok', diasNum: Math.ceil(dias) };
}

function fmtData(s) {
  if (!s) return '';
  return new Date(s).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}

function fileIcon(nome) {
  const ext = (nome.split('.').pop()||'').toLowerCase();
  if (ext==='pdf') return '📄';
  if (['jpg','jpeg','png','gif','webp'].includes(ext)) return '🖼️';
  if (['doc','docx'].includes(ext)) return '📝';
  if (['xls','xlsx'].includes(ext)) return '📊';
  if (['zip','rar'].includes(ext)) return '🗜️';
  return '📎';
}

function fmtBytes(b) {
  if (!b) return '';
  if (b < 1024) return b+' B';
  if (b < 1048576) return (b/1024).toFixed(1)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}

function buildMateriaSection(m) {

  div.id = 'section-' + m.id;
  div.className = 'section-hidden';
  div.innerHTML = `
    <div class="materia-header">
      <div class="materia-code">${m.code}</div>
      <div class="materia-title">${m.nome}</div>
    </div>
    <div class="tabs" id="${m.id}-tabs">
      <button class="tab active" data-mid="${m.id}" data-tab="anotacoes">✏️ Anotações</button>
      <button class="tab" data-mid="${m.id}" data-tab="tarefas">✅ Tarefas</button>
      <button class="tab" data-mid="${m.id}" data-tab="anexos">📎 Anexos</button>
    </div>
    <div id="${m.id}-tab-anotacoes">
      <div class="anotacao-toolbar">
        <button class="btn primary" data-action="copiar" data-mid="${m.id}">📋 Copiar tudo</button>
        <button class="btn danger" data-action="limpar" data-mid="${m.id}">🗑️ Limpar</button>
      </div>
      <textarea class="anotacao-area" id="${m.id}-anotacao" placeholder="Suas anotações aqui…"></textarea>
      <div class="anotacao-meta" id="${m.id}-anotacao-meta"></div>
    </div>
    <div id="${m.id}-tab-tarefas" class="section-hidden">
      <div class="nova-tarefa-form">
        <div class="form-row">
          <div class="form-group" style="flex:2">
            <label class="form-label">Título da tarefa</label>
            <input class="form-input" id="${m.id}-tf-titulo" placeholder="Ex: Trabalho sobre DSM-5…">
          </div>
          <div class="form-group">
            <label class="form-label">Prazo</label>
            <input class="form-input" type="datetime-local" id="${m.id}-tf-data">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Descrição (opcional)</label>
            <textarea class="form-input" id="${m.id}-tf-desc" placeholder="Detalhes…"></textarea>
          </div>
        </div>
        <button class="btn primary" data-action="add-tarefa" data-mid="${m.id}">+ Adicionar tarefa</button>
      </div>
      <div class="tarefa-list" id="${m.id}-tarefas"></div>
    </div>
    <div id="${m.id}-tab-anexos" class="section-hidden">
      <div class="upload-area" id="${m.id}-upload-area">
        <div class="upload-icon">📁</div>
        <div class="upload-text">Clique ou arraste arquivos aqui</div>
        <div class="upload-sub">PDF, imagens, Word e qualquer outro tipo</div>
      </div>
      <input type="file" id="${m.id}-file-input" class="upload-input" multiple>
      <div class="anexo-list" id="${m.id}-anexos"></div>
    </div>`;

  document.getElementById('main').appendChild(div);

  div.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => switchTab(btn.dataset.mid, btn.dataset.tab, btn)));
  div.querySelectorAll('[data-action="copiar"]').forEach(b => b.addEventListener('click', () => copiarAnotacao(b.dataset.mid)));
  div.querySelectorAll('[data-action="limpar"]').forEach(b => b.addEventListener('click', () => limparAnotacao(b.dataset.mid)));
  div.querySelector(`#${m.id}-anotacao`).addEventListener('input', () => onAnotacaoInput(m.id));
  div.querySelectorAll('[data-action="add-tarefa"]').forEach(b => b.addEventListener('click', () => addTarefa(b.dataset.mid)));

  const uploadArea = div.querySelector(`#${m.id}-upload-area`);
  const fileInput  = div.querySelector(`#${m.id}-file-input`);
  uploadArea.addEventListener('click', () => fileInput.click());
  uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('drag'); });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag'));
  uploadArea.addEventListener('drop', e => { e.preventDefault(); uploadArea.classList.remove('drag'); uploadFiles(m.id, e.dataTransfer.files); });
  fileInput.addEventListener('change', () => { uploadFiles(m.id, fileInput.files); fileInput.value=''; });
}

MATERIAS.forEach(buildMateriaSection);

function navigate(section) {
  document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.section===section));
  document.querySelectorAll('[id^="section-"]').forEach(s => s.classList.add('section-hidden'));
  const el = document.getElementById('section-'+section);
  if (el) el.classList.remove('section-hidden');
  closeSidebar();
}
document.querySelectorAll('.nav-item').forEach(btn => btn.addEventListener('click', () => navigate(btn.dataset.section)));

function switchTab(mid, tab, btn) {
  ['anotacoes','tarefas','anexos'].forEach(t => {
    const el = document.getElementById(`${mid}-tab-${t}`);
    if (el) el.classList.add('section-hidden');
  });
  document.getElementById(`${mid}-tab-${tab}`)?.classList.remove('section-hidden');
  document.querySelectorAll(`#${mid}-tabs .tab`).forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
document.getElementById('mobToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
});
document.getElementById('overlay').addEventListener('click', closeSidebar);
document.getElementById('bannerClose').addEventListener('click', () => document.getElementById('banner').classList.remove('show'));

onValue(ref(db, 'psicoapp'), snap => {
  allData = snap.val() || {};
  renderAll();
  setSyncStatus('ok');
}, () => setSyncStatus('offline'));

function renderAll() {
  MATERIAS.forEach(m => { renderAnotacao(m.id); renderTarefas(m.id); renderAnexos(m.id); updateBadge(m.id); });
  renderDashboard();
  checkBanner();
}

function renderAnotacao(mid) {
  const data = allData[mid]?.anotacao || {};
  const ta = document.getElementById(`${mid}-anotacao`);
  if (ta && document.activeElement !== ta) {
    ta.value = data.texto || '';
    const meta = document.getElementById(`${mid}-anotacao-meta`);
    if (meta && data.atualizado) meta.textContent = 'Salvo em ' + fmtData(data.atualizado);
  }
}
function onAnotacaoInput(mid) {
  clearTimeout(anotacaoTimers[mid]);
  anotacaoTimers[mid] = setTimeout(() => saveAnotacao(mid), 1200);
}
function saveAnotacao(mid) {
  setSyncStatus('syncing');
  const texto = document.getElementById(`${mid}-anotacao`).value;
  set(ref(db, `psicoapp/${mid}/anotacao`), { texto, atualizado: new Date().toISOString() })
    .then(() => { setSyncStatus('ok'); const m = document.getElementById(`${mid}-anotacao-meta`); if(m) m.textContent='Salvo agora'; })
    .catch(() => setSyncStatus('offline'));
}
function copiarAnotacao(mid) {
  navigator.clipboard.writeText(document.getElementById(`${mid}-anotacao`).value).then(() => toast('📋 Copiado!', 'success'));
}
function limparAnotacao(mid) {
  if (!confirm('Limpar anotações desta matéria?')) return;
  document.getElementById(`${mid}-anotacao`).value = '';
  saveAnotacao(mid);
}

function renderTarefas(mid) {
  const tarefas = allData[mid]?.tarefas || {};
  const container = document.getElementById(`${mid}-tarefas`);
  if (!container) return;
  const lista = Object.entries(tarefas)
    .filter(([,t]) => !t.concluida)
    .sort((a,b) => { if(!a[1].data) return 1; if(!b[1].data) return -1; return new Date(a[1].data)-new Date(b[1].data); });
  if (!lista.length) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">✅</div><div class="empty-text">Nenhuma tarefa pendente</div></div>';
    return;
  }
  container.innerHTML = '';
  lista.forEach(([id, t]) => {
    const urg = calcUrgencia(t.data);
    const card = document.createElement('div');
    card.className = 'tarefa-card';
    let alertaDias = '';
    if (urg?.cls === 'dias')  alertaDias = `<div class="alerta-dias">🗓️ Faltam ${urg.diasNum} dias para o prazo</div>`;
    if (urg?.cls === 'breve') alertaDias = `<div class="alerta-dias alerta-breve">⏰ Faltam ${urg.diasNum} dia${urg.diasNum!==1?'s':''} — esta semana!</div>`;
    card.innerHTML = `
      <div class="tarefa-check"></div>
      <div class="tarefa-body">
        ${alertaDias}
        <div class="tarefa-titulo">${t.titulo||''}</div>
        ${t.desc ? `<div class="tarefa-desc">${t.desc}</div>` : ''}
        <div class="tarefa-footer">
          ${urg ? `<span class="urgencia-badge ${urg.cls}">${urg.label}</span>` : ''}
          ${t.data ? `<span class="tarefa-data">📅 ${fmtData(t.data)}</span>` : ''}
          <div class="tarefa-actions"><button class="btn small danger" data-del="${id}">🗑️</button></div>
        </div>
      </div>`;
    card.querySelector('.tarefa-check').addEventListener('click', () => {
      card.classList.add('tarefa-saindo');
      setTimeout(() => set(ref(db, `psicoapp/${mid}/tarefas/${id}/concluida`), true), 400);
    });
    card.querySelector(`[data-del="${id}"]`).addEventListener('click', () => {
      if (confirm('Excluir esta tarefa?')) remove(ref(db, `psicoapp/${mid}/tarefas/${id}`));
    });
    container.appendChild(card);
  });
}

function addTarefa(mid) {
  const titulo = document.getElementById(`${mid}-tf-titulo`).value.trim();
  if (!titulo) { toast('Informe o título da tarefa', 'error'); return; }
  const data = document.getElementById(`${mid}-tf-data`).value || null;
  const desc = document.getElementById(`${mid}-tf-desc`).value.trim();
  setSyncStatus('syncing');
  push(ref(db, `psicoapp/${mid}/tarefas`), { titulo, desc, data, concluida:false, criada:new Date().toISOString() })
    .then(() => {
      setSyncStatus('ok'); toast('Tarefa adicionada!', 'success');
      document.getElementById(`${mid}-tf-titulo`).value = '';
      document.getElementById(`${mid}-tf-data`).value = '';
      document.getElementById(`${mid}-tf-desc`).value = '';
    }).catch(() => setSyncStatus('offline'));
}

function updateBadge(mid) {
  const tarefas = allData[mid]?.tarefas || {};
  const pendentes = Object.values(tarefas).filter(t => { if(t.concluida) return false; const u=calcUrgencia(t.data); return u && u.cls!=='ok'; });
  const badge = document.getElementById('badge-'+mid);
  if (!badge) return;
  if (pendentes.length > 0) {
    badge.style.display='inline'; badge.textContent=pendentes.length;
    const hasUrgente = pendentes.some(t => calcUrgencia(t.data)?.cls==='urgente');
    const hasBreve   = pendentes.some(t => calcUrgencia(t.data)?.cls==='breve');
    badge.className = 'badge' + (hasUrgente ? '' : hasBreve ? ' soon' : ' dias');
  } else { badge.style.display='none'; }
}

function checkBanner() {
  const itens = [];
  MATERIAS.forEach(m => {
    Object.values(allData[m.id]?.tarefas||{}).forEach(t => {
      if (t.concluida) return;
      const u = calcUrgencia(t.data);
      if (u && u.cls!=='ok') itens.push({ ...t, materia:m.code, urg:u });
    });
  });
  const banner = document.getElementById('banner');
  if (!itens.length) { banner.classList.remove('show'); return; }
  itens.sort((a,b) => new Date(a.data)-new Date(b.data));
  document.getElementById('bannerItems').innerHTML = itens.slice(0,6).map(i => {
    const emoji = i.urg.cls==='urgente' ? '🔴' : i.urg.cls==='breve' ? '🟡' : '🔵';
    return `<div class="banner-item ${i.urg.cls}"><span>${emoji}</span><span><b>${i.materia}</b> — ${i.titulo}</span><span style="margin-left:auto;font-family:monospace;font-size:11px;opacity:.7">${fmtData(i.data)}</span></div>`;
  }).join('');
  banner.classList.add('show');
}

function renderDashboard() {
  let total=0,urgentes=0,concluidas=0,totalAnexos=0,totalAnotacoes=0;
  const proximas=[];
  MATERIAS.forEach(m => {
    if((allData[m.id]?.anotacao?.texto||'').trim()) totalAnotacoes++;
    totalAnexos+=Object.keys(allData[m.id]?.anexos||{}).length;
    Object.entries(allData[m.id]?.tarefas||{}).forEach(([,t])=>{
      total++;
      if(t.concluida){concluidas++;return;}
      const u=calcUrgencia(t.data);
      if(u?.cls==='urgente') urgentes++;
      if(t.data) proximas.push({...t,materia:m.code,urg:u});
    });
  });
  proximas.sort((a,b)=>new Date(a.data)-new Date(b.data));
  document.getElementById('dashStats').innerHTML=`
    <div class="dash-card"><div class="dash-card-val">${total}</div><div class="dash-card-label">Total de tarefas</div></div>
    <div class="dash-card"><div class="dash-card-val" style="color:var(--urgent)">${urgentes}</div><div class="dash-card-label">Urgentes</div></div>
    <div class="dash-card"><div class="dash-card-val" style="color:var(--success)">${concluidas}</div><div class="dash-card-label">Concluídas</div></div>
    <div class="dash-card"><div class="dash-card-val">${totalAnexos}</div><div class="dash-card-label">Anexos</div></div>
    <div class="dash-card"><div class="dash-card-val">${totalAnotacoes}</div><div class="dash-card-label">Com anotações</div></div>`;
  const proxEl=document.getElementById('dashProximas');
  if(!proximas.length){proxEl.innerHTML='<div style="color:var(--text3);font-size:13px;padding:12px 0">Nenhuma tarefa pendente com prazo 🎉</div>';return;}
  proxEl.innerHTML=proximas.slice(0,8).map(t=>`<div class="dash-tarefa-row">${t.urg?`<span class="urgencia-badge ${t.urg.cls}">${t.urg.label}</span>`:''}<span class="dash-materia-pill">${t.materia}</span><span style="flex:1;font-size:12px;color:var(--text);font-weight:500">${t.titulo}</span><span style="font-size:11px;color:var(--text3);font-family:monospace">${fmtData(t.data)}</span></div>`).join('');
}

function renderAnexos(mid) {
  const anexos=allData[mid]?.anexos||{};
  const container=document.getElementById(`${mid}-anexos`);
  if(!container) return;
  const lista=Object.entries(anexos);
  if(!lista.length){container.innerHTML='';return;}
  container.innerHTML='';
  lista.forEach(([id,a])=>{
    const card=document.createElement('div');
    card.className='anexo-card';
    card.innerHTML=`<div class="anexo-icon">${fileIcon(a.nome)}</div><div class="anexo-info"><div class="anexo-nome">${a.nome}</div><div class="anexo-meta">${fmtBytes(a.tamanho)} · ${fmtData(a.enviado)}</div></div><div class="anexo-actions"><a href="${a.url}" target="_blank"><button class="btn small">⬇️ Baixar</button></a><button class="btn small danger" data-del="${id}">🗑️</button></div>`;
    card.querySelector(`[data-del="${id}"]`).addEventListener('click',()=>deleteAnexo(mid,id,a.path));
    container.appendChild(card);
  });
}

async function uploadFiles(mid,files){
  if(!files||!files.length) return;
  for(const file of files){
    toast(`Enviando ${file.name}…`); setSyncStatus('syncing');
    try{
      const path=`psicoapp/${mid}/${Date.now()}_${file.name}`;
      const storRef=sref(storage,path);
      await uploadBytes(storRef,file);
      const url=await getDownloadURL(storRef);
      await push(ref(db,`psicoapp/${mid}/anexos`),{nome:file.name,url,path,tamanho:file.size,enviado:new Date().toISOString()});
      setSyncStatus('ok'); toast(`✅ ${file.name} enviado!`,'success');
    }catch(e){console.error(e);toast('Erro ao enviar arquivo.','error');setSyncStatus('offline');}
  }
}

async function deleteAnexo(mid,id,path){
  if(!confirm('Excluir este anexo?')) return;
  try{await deleteObject(sref(storage,path));}catch(e){console.warn(e);}
  await remove(ref(db,`psicoapp/${mid}/anexos/${id}`));
  toast('Anexo excluído');
}

document.getElementById('btnExportar').addEventListener('click',()=>{
  const agora=new Date();
  const exportData={exportado:agora.toISOString(),versao:'1.0',dados:{}};
  MATERIAS.forEach(m=>{exportData.dados[m.id]={anotacao:allData[m.id]?.anotacao||{},tarefas:allData[m.id]?.tarefas||{}};});
  const blob=new Blob([JSON.stringify(exportData,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`psicoapp-backup-${agora.toISOString().slice(0,10)}.json`; a.click();
  URL.revokeObjectURL(url); toast('✅ Backup baixado!','success');
});

document.getElementById('importFile').addEventListener('change',async e=>{
  const file=e.target.files[0]; if(!file) return;
  try{
    const dados=JSON.parse(await file.text());
    if(!dados.dados){toast('Arquivo inválido','error');return;}
    if(!confirm(`Restaurar backup de ${dados.exportado?new Date(dados.exportado).toLocaleString('pt-BR'):'data desconhecida'}?\n\nIsso vai sobrescrever suas anotações e tarefas atuais.`)) return;
    setSyncStatus('syncing'); toast('Restaurando…');
    for(const mid of Object.keys(dados.dados)){
      const d=dados.dados[mid];
      if(d.anotacao&&Object.keys(d.anotacao).length) await set(ref(db,`psicoapp/${mid}/anotacao`),d.anotacao);
      if(d.tarefas&&Object.keys(d.tarefas).length) await set(ref(db,`psicoapp/${mid}/tarefas`),d.tarefas);
    }
    setSyncStatus('ok'); toast('✅ Backup restaurado!','success');
  }catch(err){toast('Erro ao ler o arquivo de backup','error');}
  e.target.value='';
});
</script>
